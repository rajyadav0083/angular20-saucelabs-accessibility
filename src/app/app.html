<main class="container">
  <h1 class="title">Hello World</h1>

  <h2>Welcome</h2>

  <form (submit)="submit($event)">
    <div class="field">
      <label for="name">Name</label>
      <input id="name" name="name" type="text" autocomplete="name" placeholder="Enter your name">
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="Enter email">
    </div>

    <button type="submit" class="submit">Submit</button>
  </form>

  @if (submitted()) {
    <p role="status">Thanks, your details were submitted.</p>
  }

  <p class="note">This is an accessibility demonstration.</p>
</main>

<router-outlet />
